content: |
  Merhaba, ben Uhut Sancar. Bursa'da yaşıyorum ve 2023'ten bu yana profesyonel olarak web uygulamaları geliştiriyorum.

  Kütahya Dumlupınar Üniversitesi Bilgisayar Mühendisliği bölümünden 3.38/4 ortalamayla mezun oldum. Lisans eğitimimden önce İngilizce hazırlık programını tamamladım.

  Yazılım geliştirmede özellikle frontend tarafına yoğunlaşıyorum. Bununla birlikte bir ürünü yalnızca kullanıcı arayüzünden ibaret görmediğim için backend geliştirme, veri modelleme, mobil uygulama geliştirme ve cloud servisleri üzerinde de çalışıyorum.

  ### Profesyonel deneyimim

  Diam&Tech bünyesinde iki yıl boyunca part-time Front-End Developer olarak çalıştım. Bu süreçte Angular ve React kullanarak müşteri odaklı web uygulamaları geliştirdim; component mimarisi, RESTful API entegrasyonları, responsive tasarım, erişilebilirlik, SSR, SEO ve performans iyileştirmeleri üzerinde çalıştım.

  Farklı zaman dilimlerindeki uluslararası ekiplerle iş birliği yaptım, code review süreçlerine katıldım ve projelerde alınan teknik kararlara katkı sağladım.

  trex'te ise full-time stajyer olarak Nuxt, Nuxt UI, Vue, TypeScript ve Pinia kullanarak landing page ve dashboard uygulamaları geliştirdim.

  Bu deneyimler bana yalnızca kod yazmayı değil; mevcut bir proje yapısını anlamayı, takım standartlarına uyum sağlamayı ve sürdürülebilir çözümler üretmeyi öğretti.

  ### Frontend yaklaşımım

  Bir sayfanın masaüstünde doğru görünmesini yeterli bulmuyorum. Arayüzün farklı ekran boyutlarında bozulmaması, mobil cihazlarda klavye ve modal davranışlarının doğru çalışması, yüklenme ve hata durumlarının kullanıcıya düzgün gösterilmesi benim için en az görsel sonuç kadar önemli.

  Component geliştirirken sorumlulukların net olmasına, TypeScript tiplerinin doğru tanımlanmasına, tekrar eden kodun azaltılmasına ve gereksiz render işlemlerinin önlenmesine dikkat ediyorum.

  Nuxt ve Vue tarafında TypeScript tabanlı, SSR destekli uygulamalar geliştiriyorum. Nuxt UI ile tutarlı ve erişilebilir arayüzler kuruyor, içerik yönetimi gereken projelerde Nuxt Content ile Markdown ve YAML tabanlı yapılar tercih ediyorum. Pinia ile state'i yönetirken SSR sırasında verinin gereksiz yere tekrar çekilmesini önleyecek yapılar kuruyorum.

  Angular tarafında SSR, hydration, RxJS, resolver, guard, interceptor, reactive form, lazy loading ve uluslararasılaştırma; React tarafında Redux Toolkit, React Router, Axios interceptor, form doğrulama ve lazy route yapıları üzerinde çalıştım.

  ### Backend ve mobil

  Backend tarafında Node.js, Express ve MongoDB kullanıyorum. REST API geliştirme, JWT tabanlı kimlik doğrulama, şifre güvenliği, rol ve yetkilendirme sistemleri, pagination, arama, filtreleme ve medya yönetimi üzerinde çalışıyorum.

  MongoDB veri modellerini uygulamanın sorgulama şekline göre kuruyorum; embed ve reference yaklaşımları arasında ihtiyaca göre seçim yapıyor, index ve sorgu performansını göz önünde bulunduruyorum. Gerçek zamanlı iletişim gereken yerlerde Socket.IO kullanıyor, medya dosyalarını Amazon S3'te saklayıp CloudFront üzerinden sunuyorum.

  Mobil tarafta React Native ve Expo ile uygulamalar geliştiriyorum. Navigasyon, global state yönetimi, API iletişimi, safe area kullanımı ve klavye davranışları gibi konulara önem veriyorum; bir tasarımın yalnızca tek bir cihazda çalışmasını yeterli görmüyorum.

  ### Hedefim

  Frontend alanındaki deneyimimi backend, mobil ve cloud teknolojileriyle birleştirerek uçtan uca ürün geliştirebilen bir yazılım geliştirici olarak ilerlemek istiyorum. Verilen tasarımı kodlayan değil; ürünün mimarisine, performansına ve kullanıcı deneyimine katkı sağlayan bir geliştirici olmayı hedefliyorum.

  [Projelerime](/projects) göz atabilir, birlikte çalışmak için [iletişime geçebilirsiniz](/contact).

