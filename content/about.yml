content: |
  Hi, I'm Emma Thompson, a UX/UI Designer and Front-End Developer based right here in Boston. For the past six years, I've been immersed in the world of digital product creation, focusing on building experiences that are not just functional, but genuinely intuitive and engaging for users.

  My path started at Boston University, where I earned a degree in Interactive Design. It was there I discovered my dual passion for the visual language of design and the logical puzzle of code.

  Since then, I've honed my skills in both areas, believing that the best digital products are born from a deep understanding of both aesthetics and implementation.

  ### My Design Philosophy

  My design philosophy is rooted in empathy and problem-solving. I believe great design starts with understanding the **why** — the user's needs, motivations, and pain points.

  I use research, iterative prototyping, often with tools like Figma, and user testing to ensure the solutions I build are truly effective.

  I strive to create interfaces that feel effortless, where functionality and beauty work hand-in-hand.

  Whether I'm crafting pixel-perfect user interfaces or writing clean Vue.js and Nuxt.js code, my focus is always on creating value for the end user.

  ### What Drives Me

  What keeps me excited about this work is the constant learning and the challenge of translating complex ideas into simple, elegant solutions.

  There's nothing more rewarding than seeing a design come to life and knowing it's making someone's digital interaction easier or more enjoyable.

  ### Beyond the Screen

  When I'm not designing or coding, you might find me exploring Boston's latest coffee shops, hiking nearby trails, or occasionally contributing to open-source projects.

  Thanks for stopping by. Feel free to browse my [projects](/projects) or [get in touch](mailto:ui-pro@nuxt.com) if you'd like to collaborate.

