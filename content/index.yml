faq:
  title: Sık sorulan sorular
  description: Çalışma şeklim ve kullandığım teknolojiler hakkında.
  categories:
    - title: Çalışma şeklim
      questions:
        - label: Bir özelliği geliştirmeye nasıl başlıyorsun?
          content: Önce kullanıcı ihtiyacını ve veri akışını anlamaya çalışıyorum. Frontend, backend ve veritabanı arasındaki bağlantıyı birlikte değerlendiriyorum. Yalnızca başarılı senaryoyu değil; yüklenme, boş veri, bağlantı hatası, yetki problemi ve beklenmeyen API cevabı gibi durumları da baştan planlıyorum.
        - label: Mevcut bir projeye dahil olurken nasıl ilerliyorsun?
          content: Projenin mevcut mimarisini ve takım standartlarını anlamadan yeni yapı kurmuyorum. Gereksiz component, composable veya klasör eklemek yerine var olan yapıyı koruyarak geliştirmeyi tercih ediyorum. Kullanılmayan dosya ve bağımlılıkları projede bırakmıyorum.
        - label: Kod kalitesi için nelere dikkat ediyorsun?
          content: Component sorumluluklarının net olması, TypeScript tiplerinin doğru tanımlanması, tekrar eden kodun azaltılması, gereksiz render işlemlerinin önlenmesi ve kodun okunabilir kalması. Güvenlik ve performansı sonradan eklenen bir adım değil, geliştirme sürecinin parçası olarak görüyorum.
    - title: Teknolojiler
      questions:
        - label: Hangi teknolojilerle çalışıyorsun?
          content: Frontend'de Nuxt, Vue, Angular, React ve Next.js; state için Pinia, Redux Toolkit ve RxJS. Backend'de Node.js, Express ve MongoDB; gerçek zamanlı özelliklerde Socket.IO. Mobilde React Native ve Expo. Ayrıca TypeScript, Tailwind CSS, Docker, AWS (S3, CloudFront), Redis ve Jira kullanıyorum.
        - label: SSR ve performans tarafında neler yapıyorsun?
          content: SSR ve hydration, lazy loading, route bazlı kod bölme, veri önbellekleme, SEO meta yönetimi ve gereksiz istekleri engelleyen veri akışları üzerinde çalışıyorum. Responsive yapıyı sadece tarayıcıda değil gerçek cihazlarda da kontrol ediyorum.
        - label: Erişilebilirlik senin için ne ifade ediyor?
          content: Arayüzün klavyeyle kullanılabilmesi, doğru semantik etiketler, yeterli kontrast, odak durumlarının görünür olması ve ekran okuyucular için anlamlı metinler. Erişilebilirliği tasarımın sonuna eklenen bir kontrol listesi değil, geliştirmenin bir parçası olarak ele alıyorum.
    - title: Hakkımda
      questions:
        - label: Eğitim geçmişin nedir?
          content: Kütahya Dumlupınar Üniversitesi Mühendislik Fakültesi Bilgisayar Mühendisliği lisans programından 3.41/4 ortalama ile mezun oldum. Lisans eğitimimden önce İngilizce hazırlık programını tamamladım. İngilizce seviyem B2.
        - label: Kariyer hedefin ne?
          content: Frontend'deki profesyonel deneyimimi backend, mobil ve cloud teknolojileriyle birleştirerek uçtan uca ürün geliştirebilen bir yazılım geliştirici olarak ilerlemek. Uzun vadede yüksek kullanıcı sayılarına hizmet veren, ölçeklenebilir ürünlerde çalışmak istiyorum.
        - label: Şu anda yeni bir pozisyona açık mısın?
          content: Evet. Frontend ağırlıklı veya full-stack pozisyonlar için iletişime geçebilirsiniz. En hızlı şekilde iletişim sayfasındaki formdan veya sancaruhut@gmail.com adresinden ulaşabilirsiniz.
