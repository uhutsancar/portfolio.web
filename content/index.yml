faq:
  title: Frequently Asked Questions

  description: >-
    Answers to common questions about my process and services.

  categories:
    - title: 'Services & Process'

      questions:
        - label: What services do you offer?

          content: >-
            I specialize in UX/UI design and front-end development.
            This includes user research, wireframing, interactive
            prototyping, creating intuitive user interfaces, building
            responsive websites and web applications, and developing
            design systems. My goal is to create seamless digital
            experiences from concept to deployment.

        - label: What is your design process like?

          content: >-
            My process is collaborative and iterative, typically
            involving Discovery and Research, Ideation and Prototyping,
            User Testing, Visual Design, and close collaboration with
            development teams during implementation. I tailor the
            process based on project needs while keeping the solution
            user-centered.

        - label: Do you work with startups?

          content: >-
            Absolutely. I enjoy working with startups to help shape
            their product vision and create user-friendly interfaces
            from the ground up. I adapt my process to fit fast-moving
            startup environments.

    - title: 'Pricing & Timelines'

      questions:
        - label: How much does a project typically cost?

          content: >-
            Project costs vary based on scope, complexity, features,
            and timeline. Comprehensive UX/UI design and front-end
            development engagements typically start around $5,000,
            with average projects ranging between $8,000 and $25,000.

        - label: What are your payment terms?

          content: >-
            I generally require a 40% deposit to schedule the project
            and begin work, with the remaining 60% due upon successful
            project completion and delivery.

        - label: How long does a typical project take?

          content: >-
            Timelines depend on the project scope and complexity.
            Smaller projects might take three to four weeks, while
            larger projects can range from two to four months.

        - label: Do you offer retainers or ongoing support?

          content: >-
            Yes. For clients needing ongoing design support, feature
            development, or maintenance, I offer monthly retainer
            options tailored to their needs.

    - title: About Me

      questions:
        - label: What do you enjoy most about your work?

          content: >-
            I love solving complex problems through design and
            technology. It is rewarding to see people interact
            with something I created and find it genuinely useful
            and easy to navigate.

        - label: What are your hobbies outside of work?

          content: >-
            When I am not designing or coding, I enjoy exploring
            Boston, visiting coffee shops, hiking, photography,
            and occasionally contributing to open-source projects.
