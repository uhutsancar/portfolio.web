about:
  title: Hakkımda
  description: Kütahya Dumlupınar Üniversitesi Bilgisayar Mühendisliği mezunuyum. 2023'ten bu yana profesyonel olarak frontend geliştiriyorum; Diam&Tech'te iki yıl Angular ve React ile müşteri odaklı web uygulamaları geliştirdim, trex'te Nuxt ve Vue ile landing page ve dashboard projelerinde çalıştım. Bir ürünü yalnızca arayüzden ibaret görmediğim için backend, veri modelleme, mobil ve cloud tarafında da çalışıyorum.
