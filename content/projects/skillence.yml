title: Skillence — yapay zeka destekli CV analizi
description: >-
  Yüklenen CV'yi seçilen iş ilanıyla karşılaştırıp yapay zeka desteğiyle geri
  bildirim veren uygulama. React Router 7 ile dosya tabanlı yönlendirme,
  pdfjs ile tarayıcıda PDF ayrıştırma, react-dropzone ile dosya yükleme ve
  Zustand ile state yönetimi kullandım. Yüklenme, hatalı dosya ve boş sonuç
  durumlarını arayüzde ayrı ayrı ele aldım.
