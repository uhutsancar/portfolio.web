title: Velora — dağıtık e-ticaret altyapısı
description: >-
  .NET 8 ile geliştirdiğim, mikroservis mimarisine dayalı e-ticaret altyapısı.
  Identity, Catalog, Basket, Order, Payment ve Notification servisleri kendi
  veritabanlarıyla ayrı ayrı çalışıyor; istemciler Ocelot tabanlı API
  Gateway üzerinden tek adrese gidiyor. Servisler arası iletişimi
  BuildingBlocks altında yazdığım event bus katmanıyla kurdum: sözleşmeler
  soyut tutuluyor, RabbitMQ ve Azure Service Bus implementasyonları arasında
  konfigürasyondan geçiş yapılabiliyor. Sipariş–ödeme akışı integration
  event'ler üzerinden yürüyor, altyapı bileşenleri Docker Compose ile ayağa
  kalkıyor.
image: /images/projects-3.avif
url: https://github.com/uhutsancar/Velora
