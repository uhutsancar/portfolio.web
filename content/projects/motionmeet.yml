title: MotionMeet — sporcuları buluşturan sosyal platform
description: >-
  Sporcuların birbirini bulup etkinlik paylaşabildiği full-stack sosyal medya
  uygulaması. İstemci tarafında React ve Redux Toolkit ile state yönetimi,
  sunucu tarafında Express ve Mongoose ile REST API geliştirdim. Clerk ile
  kimlik doğrulama, ImageKit ile medya yönetimi, Inngest ile arka plan işleri
  ve Nodemailer ile e-posta bildirimleri kullandım.
image: /images/motionmeet.webp
url: https://github.com/uhutsancar/motionmeet.app
